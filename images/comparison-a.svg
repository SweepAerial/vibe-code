<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000">
  <defs>
    <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6045"/>
      <stop offset="100%" stop-color="#3d4230"/>
    </linearGradient>
    <pattern id="gridA" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0L0 0 0 80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="noiseA">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Base ground -->
  <rect width="2000" height="1000" fill="url(#skyA)"/>

  <!-- Large field blocks - muted palette -->
  <rect x="0" y="0" width="420" height="310" fill="#4a5238" opacity="0.9"/>
  <rect x="420" y="0" width="350" height="220" fill="#3e4530" opacity="0.85"/>
  <rect x="770" y="0" width="430" height="280" fill="#545c42" opacity="0.9"/>
  <rect x="1200" y="0" width="380" height="190" fill="#404835" opacity="0.88"/>
  <rect x="1580" y="0" width="420" height="250" fill="#4c5540" opacity="0.9"/>

  <rect x="0" y="310" width="280" height="340" fill="#3a4228" opacity="0.85"/>
  <rect x="280" y="220" width="320" height="430" fill="#4e5640" opacity="0.9"/>
  <rect x="600" y="280" width="280" height="380" fill="#424a35" opacity="0.88"/>
  <rect x="880" y="190" width="360" height="440" fill="#505840" opacity="0.85"/>
  <rect x="1240" y="190" width="300" height="410" fill="#3c4430" opacity="0.88"/>
  <rect x="1540" y="250" width="460" height="350" fill="#485038" opacity="0.9"/>

  <rect x="0" y="650" width="350" height="350" fill="#3e452e" opacity="0.9"/>
  <rect x="350" y="650" width="400" height="350" fill="#525a40" opacity="0.85"/>
  <rect x="750" y="660" width="340" height="340" fill="#444c36" opacity="0.88"/>
  <rect x="1090" y="600" width="410" height="400" fill="#4a5238" opacity="0.9"/>
  <rect x="1500" y="600" width="500" height="400" fill="#404835" opacity="0.88"/>

  <!-- Roads - muted grey -->
  <rect x="0" y="295" width="2000" height="18" fill="#6a6e60" opacity="0.6"/>
  <rect x="0" y="635" width="2000" height="16" fill="#6a6e60" opacity="0.55"/>
  <rect x="595" y="0" width="16" height="1000" fill="#6a6e60" opacity="0.5"/>
  <rect x="1230" y="0" width="16" height="1000" fill="#6a6e60" opacity="0.5"/>

  <!-- Buildings cluster - industrial area, muted -->
  <rect x="640" y="330" width="130" height="90" fill="#5c6050" opacity="0.8"/>
  <rect x="660" y="340" width="40" height="30" fill="#4a4e40" opacity="0.9"/>
  <rect x="720" y="340" width="35" height="30" fill="#4a4e40" opacity="0.9"/>
  <rect x="660" y="380" width="95" height="30" fill="#4a4e40" opacity="0.9"/>
  <rect x="790" y="330" width="80" height="80" fill="#545848" opacity="0.8"/>
  <rect x="800" y="340" width="60" height="60" fill="#484c3c" opacity="0.9"/>

  <!-- Another building cluster -->
  <rect x="1280" y="210" width="110" height="80" fill="#5a5e4e" opacity="0.8"/>
  <rect x="1290" y="220" width="90" height="60" fill="#484c3c" opacity="0.85"/>
  <rect x="1400" y="220" width="90" height="70" fill="#545848" opacity="0.8"/>

  <!-- Small structure cluster bottom -->
  <rect x="380" y="680" width="80" height="60" fill="#505448" opacity="0.8"/>
  <rect x="390" y="688" width="60" height="44" fill="#444840" opacity="0.9"/>
  <rect x="480" y="690" width="70" height="50" fill="#505448" opacity="0.8"/>

  <!-- Water feature - muted blue -->
  <ellipse cx="1650" cy="480" rx="180" ry="90" fill="#3d4a5a" opacity="0.75"/>
  <ellipse cx="1650" cy="480" rx="160" ry="75" fill="#354258" opacity="0.8"/>

  <!-- Grid overlay -->
  <rect width="2000" height="1000" fill="url(#gridA)"/>

  <!-- Vignette for raw look -->
  <radialGradient id="vigA" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.45)"/>
  </radialGradient>
  <rect width="2000" height="1000" fill="url(#vigA)"/>

  <!-- Noise overlay for raw texture -->
  <rect width="2000" height="1000" fill="rgba(0,0,0,0.12)" filter="url(#noiseA)" opacity="0.4"/>

  <!-- Label -->
  <rect x="24" y="24" width="140" height="36" rx="4" fill="rgba(0,0,0,0.55)"/>
  <text x="94" y="47" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="2">RAW CAPTURE</text>
</svg>
