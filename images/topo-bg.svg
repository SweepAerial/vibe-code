<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100">
  <defs>
    <style>
      .tc { fill: none; stroke: #6925bf; stroke-width: 0.5; opacity: 0.08; }
      .ti { fill: none; stroke: #6925bf; stroke-width: 0.9; opacity: 0.14; }
    </style>
  </defs>

  <!-- Hill 1 — medium, centre ~(250,280), rotated 20° -->
  <g transform="rotate(20 250 280)">
    <ellipse class="ti" cx="250" cy="280" rx="168" ry="116"/>
    <ellipse class="tc" cx="251" cy="279" rx="132" ry="91"/>
    <ellipse class="tc" cx="252" cy="278" rx="96" ry="66"/>
    <ellipse class="ti" cx="252" cy="278" rx="62" ry="43"/>
    <ellipse class="tc" cx="253" cy="277" rx="30" ry="21"/>
  </g>

  <!-- Hill 2 — elongated ridge, centre ~(680,145), rotated -15° -->
  <g transform="rotate(-15 680 145)">
    <ellipse class="ti" cx="680" cy="145" rx="265" ry="82"/>
    <ellipse class="tc" cx="680" cy="145" rx="204" ry="60"/>
    <ellipse class="tc" cx="681" cy="145" rx="142" ry="41"/>
    <ellipse class="ti" cx="681" cy="145" rx="78" ry="23"/>
  </g>

  <!-- Hill 3 — medium, centre ~(1085,295), rotated 35° -->
  <g transform="rotate(35 1085 295)">
    <ellipse class="tc" cx="1085" cy="295" rx="178" ry="126"/>
    <ellipse class="ti" cx="1086" cy="294" rx="137" ry="97"/>
