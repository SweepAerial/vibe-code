  <g transform="rotate(45 1385 525)">
    <ellipse class="tc" cx="1385" cy="525" rx="162" ry="107"/>
    <ellipse class="ti" cx="1385" cy="524" rx="124" ry="81"/>
    <ellipse class="tc" cx="1386" cy="524" rx="87" ry="56"/>
    <ellipse class="tc" cx="1386" cy="524" rx="51" ry="33"/>
    <ellipse class="ti" cx="1386" cy="524" rx="22" ry="14"/>
