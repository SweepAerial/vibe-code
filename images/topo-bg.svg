    <ellipse class="tc" cx="1490" cy="185" rx="282" ry="81"/>
    <ellipse class="ti" cx="1490" cy="185" rx="217" ry="59"/>
    <ellipse class="tc" cx="1490" cy="185" rx="150" ry="40"/>
    <ellipse class="tc" cx="1490" cy="185" rx="84" ry="22"/>
  </g>

  <!-- Small hill upper-left ~(90,160), rotated -8° -->
  <g transform="rotate(-8 90 160)">
    <ellipse class="ti" cx="90" cy="160" rx="135" ry="95"/>
    <ellipse class="tc" cx="91" cy="160" rx="95" ry="67"/>
    <ellipse class="tc" cx="91" cy="159" rx="55" ry="38"/>
    <ellipse class="ti" cx="92" cy="159" rx="22" ry="15"/>
