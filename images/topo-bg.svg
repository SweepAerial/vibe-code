    <ellipse class="tc" cx="425" cy="685" rx="228" ry="167"/>
    <ellipse class="ti" cx="426" cy="683" rx="180" ry="132"/>
    <ellipse class="tc" cx="427" cy="682" rx="134" ry="97"/>
    <ellipse class="tc" cx="427" cy="682" rx="91" ry="66"/>
    <ellipse class="ti" cx="428" cy="681" rx="53" ry="38"/>
    <ellipse class="tc" cx="428" cy="681" rx="22" ry="16"/>
