    <ellipse class="tc" cx="1630" cy="924" rx="142" ry="102"/>
    <ellipse class="tc" cx="1631" cy="924" rx="93" ry="67"/>
  </g>

  <!-- Hill 8 — large, centre ~(725,990), rotated 28° -->
