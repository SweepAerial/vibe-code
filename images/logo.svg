<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <!-- Background: transparent -->

  <!-- S letter block -->
  <text x="10" y="120" font-family="Arial Black, sans-serif" font-size="110" font-weight="900" fill="#6925bf" letter-spacing="-2">SWEEP</text>

  <!-- Geometric pyramid shape (between W and E) -->
  <polygon points="195,30 215,90 175,90" fill="none" stroke="white" stroke-width="1.5"/>
  <polygon points="195,30 215,90 205,75" fill="none" stroke="#6925bf" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Horizontal stripe lines through letters -->
  <line x1="10" y1="50" x2="340" y2="50" stroke="black" stroke-width="3" opacity="0.4"/>
  <line x1="10" y1="60" x2="340" y2="60" stroke="black" stroke-width="3" opacity="0.4"/>
  <line x1="10" y1="70" x2="340" y2="70" stroke="black" stroke-width="3" opacity="0.4"/>

  <!-- AERIAL PHOTOGRAPHY text -->
  <text x="172" y="148" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="black" letter-spacing="8">AERIAL PHOTOGRAPHY</text>
  <line x1="172" y1="152" x2="470" y2="152" stroke="black" stroke-width="1.5"/>
</svg>
