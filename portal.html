<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal | Sweep Aerial Photography</title>
  <meta name="description" content="Sweep Aerial Photography client portal. Log in to access your project files and deliverables.">
  <link rel="icon" type="image/svg+xml" href="images/PyramidWhite.svg" id="favicon">
  <link rel="stylesheet" href="css/style.css">
  <script>(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t==='system'?(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t);})();</script>
</head>
<body>

<div class="portal-wrap">
  <div class="portal-grid-bg"></div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" style="position:fixed;top:20px;right:20px;z-index:100;"></button>

  <div class="portal-box">
    <div class="portal-logo">
      <img class="theme-logo" src="images/FullSweepLogoWhiteOutline.svg" alt="Sweep Aerial Photography" onerror="this.style.display='none'">
      <div class="portal-logo-sub">Client Portal</div>
    </div>

    <h2>Welcome Back</h2>
    <p>Sign in to access your project files and deliverables.</p>

    <div class="portal-error" id="portalError">Invalid email or password. Please try again.</div>

    <form id="portalLoginForm">
      <div class="form-group">
        <label class="form-label" for="portalEmail">Email Address</label>
        <input class="form-control" type="email" id="portalEmail" name="email" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="portalPassword">Password</label>
        <input class="form-control" type="password" id="portalPassword" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;margin-top:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Sign In
      </button>
    </form>

    <div class="portal-demo-note">
      <strong>Demo Access:</strong><br>
      Email: <strong>demo@sweep.com</strong><br>
      Password: <strong>sweep2024</strong>
    </div>

    <div style="margin-top:28px;text-align:center;">
      <a href="index.html" style="font-size:0.8rem;color:var(--white-muted);display:inline-flex;align-items:center;gap:6px;transition:var(--transition);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Back to Website
      </a>
    </div>
    <div style="margin-top:16px;text-align:center;">
      <p style="font-size:0.78rem;">Need access? <a href="contact.html" style="color:var(--purple-light);">Contact us</a> to set up your account.</p>
    </div>
  </div>
</div>

<script src="js/portal.js"></script>
</body>
</html>
